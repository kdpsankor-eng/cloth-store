<!DOCTYPE html>
<html lang="bn" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অর্ডার কনফার্মেশন | অরণ্যা ফ্যাশন</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Hind Siliguri', 'Outfit', sans-serif; color: #252525; }
    .tabular-nums { font-family: 'Outfit', 'Hind Siliguri', sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="min-h-full flex flex-col bg-[#F8F9FA]">

  <main class="flex-1 max-w-2xl mx-auto px-4 py-12 w-full">
    <div id="successCard" class="bg-white rounded-3xl border border-gray-100 p-6 sm:p-10 shadow-lg text-center space-y-5">
      <div class="w-16 h-16 rounded-full bg-green-50 text-green-600 flex items-center justify-center mx-auto text-3xl">
        ✓
      </div>

      <div>
        <span class="text-xs font-bold text-green-700 bg-green-100 px-3 py-1 rounded-full uppercase tracking-wider">
          অর্ডার সফলভাবে সম্পন্ন হয়েছে
        </span>
        <h1 class="text-2xl sm:text-3xl font-extrabold font-serif text-[#252525] mt-3">
          ধন্যবাদ! আপনার অর্ডারটি গৃহীত হয়েছে
        </h1>
        <p class="text-xs text-gray-500 mt-1">আমাদের প্রতিনিধি শীঘ্রই কল করে আপনার অর্ডারটি কনফার্ম করবেন।</p>
      </div>

      <!-- Order Number Box -->
      <div class="p-4 rounded-2xl bg-[#F7F0E8] border border-[#C5A46D]/40 inline-block w-full">
        <span class="text-xs text-gray-600 block">আপনার অর্ডার নাম্বার:</span>
        <span id="orderNumberText" class="text-2xl font-mono font-bold text-[#762A43] select-all"></span>
        <p class="text-[11px] text-gray-500 mt-0.5">* অর্ডার ট্র্যাক করতে এই নাম্বারটি সংরক্ষণ করুন।</p>
      </div>

      <!-- Actions -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
        <a id="btnTrack" href="track-order.html" class="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-[#762A43] text-white text-xs font-semibold shadow-xs">
          🚚 অর্ডার ট্র্যাক করুন
        </a>
        <a id="btnWhatsApp" href="#" target="_blank" class="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-green-50 text-green-800 border border-green-200 text-xs font-semibold">
          💬 হোয়াটসঅ্যাপে মেসেজ পাঠান
        </a>
      </div>

      <!-- Details Table -->
      <div id="orderDetailsSection" class="pt-6 border-t border-gray-100 text-left space-y-4 text-xs">
        <h3 class="font-bold text-gray-700 uppercase tracking-wider">অর্ডার সারাংশ</h3>
        <div id="customerInfoBox" class="p-3 rounded-lg bg-gray-50 leading-relaxed text-gray-700"></div>
        <div id="itemsTableContainer" class="border border-gray-100 rounded-xl overflow-hidden"></div>
      </div>

      <div class="pt-4">
        <a href="index.html" class="text-xs text-gray-400 hover:text-[#762A43] underline">হোমপেজে ফিরে যান</a>
      </div>
    </div>
  </main>

  <script>
    async function loadOrder() {
      const params = new URLSearchParams(window.location.search);
      const orderNumber = params.get('orderNumber');
      if (!orderNumber) { window.location.href = 'index.html'; return; }

      document.getElementById('orderNumberText').innerText = orderNumber;
      document.getElementById('btnTrack').href = 'track-order.html?orderNumber=' + encodeURIComponent(orderNumber);

      try {
        const res = await fetch('api/orders.php?action=get_order&orderNumber=' + encodeURIComponent(orderNumber)).then(r => r.json());
        if (res.order) {
          const ord = res.order;
          document.getElementById('customerInfoBox').innerHTML = `
            <p><strong>নাম:</strong> ${ord.customerName} | <strong>ফোন:</strong> ${ord.customerPhone}</p>
            <p><strong>ঠিকানা:</strong> ${ord.deliveryAddress}</p>
            <p><strong>পেমেন্ট:</strong> ক্যাশ অন ডেলিভারি (বকেয়া ৳ ${ord.totalPayable.toLocaleString()})</p>
          `;

          const tableHtml = `
            <table class="w-full text-xs text-left">
              <thead class="bg-[#F7F0E8]/60 text-gray-700">
                <tr><th class="p-2.5">পোশাক</th><th class="p-2.5">সাইজ</th><th class="p-2.5 text-center">পরিমাণ</th><th class="p-2.5 text-right">মূল্য</th></tr>
              </thead>
              <tbody class="divide-y divide-gray-100">
                ${ord.items.map(it => `
                  <tr>
                    <td class="p-2.5 font-medium">${it.productNameSnapshot}</td>
                    <td class="p-2.5 text-gray-500">${it.variantNameSnapshot || 'Free'}</td>
                    <td class="p-2.5 text-center tabular-nums font-semibold">${it.quantity}</td>
                    <td class="p-2.5 text-right tabular-nums font-bold text-[#762A43]">৳ ${it.lineTotal.toLocaleString()}</td>
                  </tr>
                `).join('')}
              </tbody>
              <tfoot class="bg-gray-50 font-bold">
                <tr><td colspan="3" class="p-2.5 text-right text-gray-600">ডেলিভারি চার্জ:</td><td class="p-2.5 text-right tabular-nums">৳ ${ord.deliveryCharge}</td></tr>
                <tr class="text-sm"><td colspan="3" class="p-2.5 text-right text-[#252525]">সর্বমোট বিল:</td><td class="p-2.5 text-right text-[#762A43] tabular-nums">৳ ${ord.totalPayable.toLocaleString()}</td></tr>
              </tfoot>
            </table>
          `;
          document.getElementById('itemsTableContainer').innerHTML = tableHtml;

          // WhatsApp link
          const wa = encodeURIComponent(`হ্যালো! আমি একটি অর্ডার করেছি।\n\nঅর্ডার নাম্বার: ${ord.orderNumber}\nনাম: ${ord.customerName}\nমোবাইল: ${ord.customerPhone}\nমোট মূল্য: ৳ ${ord.totalPayable}\n\nঅনুগ্রহ করে অর্ডারটি দ্রুত পাঠাবেন।`);
          document.getElementById('btnWhatsApp').href = 'https://wa.me/8801712345678?text=' + wa;
        }
      } catch (err) {}
    }

    window.addEventListener('DOMContentLoaded', loadOrder);
  </script>
</body>
</html>
