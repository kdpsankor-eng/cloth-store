<!DOCTYPE html>
<html lang="bn" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পোশাক কালেকশন | অরণ্যা ফ্যাশন</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Hind Siliguri', 'Outfit', sans-serif; color: #252525; }
    .tabular-nums { font-family: 'Outfit', 'Hind Siliguri', sans-serif; font-variant-numeric: tabular-nums; }
    .product-img-box {
      width: 100%;
      height: 320px;
      overflow: hidden;
      position: relative;
      background-color: #f3f4f6;
    }
    @media (max-width: 640px) {
      .product-img-box { height: 260px; }
    }
    .product-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }
  </style>
</head>
<body class="min-h-full flex flex-col bg-[#F8F9FA]">

  <!-- Toast Notification -->
  <div id="toastNotification" class="fixed top-5 right-5 z-50 transform translate-y-[-150%] transition-transform duration-300 bg-[#762A43] text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-[#C5A46D]">
    <span class="text-xl">🛍️</span>
    <div>
      <h5 class="text-xs font-bold" id="toastTitle">ব্যাগে যুক্ত হয়েছে!</h5>
      <p class="text-[11px] text-gray-200" id="toastMessage">পণ্যটি আপনার শপিং ব্যাগে সংরক্ষিত হয়েছে।</p>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-white border-b border-gray-100 shadow-xs sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-[#762A43] text-white flex items-center justify-center font-serif font-bold">অ</div>
        <span id="brandName" class="text-xl font-bold font-serif text-[#762A43]">অরণ্যা ফ্যাশন</span>
      </a>

      <!-- Search Bar -->
      <div class="flex-1 max-w-md mx-4 relative">
        <input
          id="catalogSearch"
          type="text"
          placeholder="পোশাক খুঁজুন (যেমন: সিল্ক শাড়ি, সুতি থ্রি-পিস)..."
          class="w-full pl-4 pr-10 py-2 bg-[#F8F9FA] border border-gray-200 rounded-full text-xs focus:outline-none focus:border-[#762A43]"
          oninput="filterProducts()"
        />
        <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
      </div>

      <div class="flex items-center gap-3">
        <a href="track-order.html" class="hidden sm:inline text-xs font-semibold text-gray-600 hover:text-[#762A43]">🚚 ট্র্যাকিং</a>
        <a href="checkout.html" class="bg-[#F7F0E8] text-[#762A43] px-3.5 py-2 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-xs">
          🛍️ <span id="cartCountBadge">0</span> ব্যাগ
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl mx-auto px-4 py-6 w-full space-y-6">
    <!-- Breadcrumb & Title -->
    <div>
      <nav class="text-xs text-gray-400 mb-1">
        <a href="index.html" class="hover:text-[#762A43]">হোম</a> / <span class="text-gray-700 font-semibold">সকল পোশাক</span>
      </nav>
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <h1 class="text-2xl font-bold font-serif text-[#252525]">আমাদের সম্পূর্ণ কালেকশন</h1>
        <!-- Sorting -->
        <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg border border-gray-200 text-xs self-start">
          <span class="text-gray-500">সর্ট:</span>
          <select id="sortSelect" onchange="filterProducts()" class="bg-transparent font-medium cursor-pointer focus:outline-none">
            <option value="newest">সর্বশেষ কালেকশন</option>
            <option value="price-asc">দাম: কম থেকে বেশি</option>
            <option value="price-desc">দাম: বেশি থেকে কম</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Category Filter Pills -->
    <div id="categoryPills" class="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
      <!-- Generated by JS -->
    </div>

    <!-- Product Grid -->
    <div id="catalogGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6 items-stretch">
      <!-- Generated by JS -->
    </div>
  </main>

  <footer class="bg-[#252525] text-white py-6 text-center text-xs mt-auto">
    <p>© ২০২৬ অরণ্যা ফ্যাশন। সর্বস্বত্ব সংরক্ষিত।</p>
  </footer>

  <script>
    let allProducts = [];
    let allCategories = [];
    let selectedCategory = '';

    function showToast(title, msg) {
      const t = document.getElementById('toastNotification');
      document.getElementById('toastTitle').innerText = title;
      document.getElementById('toastMessage').innerText = msg;
      t.classList.remove('translate-y-[-150%]');
      setTimeout(() => {
        t.classList.add('translate-y-[-150%]');
      }, 3000);
    }

    function getCart() {
      try { return JSON.parse(localStorage.getItem('wcs_cart') || '[]'); } catch(e) { return []; }
    }
    function saveCart(cart) {
      localStorage.setItem('wcs_cart', JSON.stringify(cart));
      updateBadge();
    }
    function updateBadge() {
      const cart = getCart();
      document.getElementById('cartCountBadge').innerText = cart.reduce((s, x) => s + x.quantity, 0);
    }

    function addToCartQuick(prodId) {
      const p = allProducts.find(x => x.id === prodId);
      if (!p) return;

      const cart = getCart();
      const defaultVariant = (p.variants && p.variants.length > 0) ? p.variants[0] : null;
      const chosenSize = defaultVariant ? defaultVariant.size : (p.availableSizes || 'Free Size');
      const variantId = defaultVariant ? defaultVariant.id : null;
      const price = p.salePrice || p.regularPrice;

      const match = cart.find(x => x.productId === p.id && (!variantId || x.variantId === variantId));
      if (match) {
        match.quantity += 1;
      } else {
        cart.push({
          productId: p.id,
          variantId: variantId,
          name: p.name,
          nameBn: p.nameBn,
          slug: p.slug,
          imageUrl: p.images[0],
          price: price,
          size: chosenSize,
          quantity: 1
        });
      }
      saveCart(cart);
      showToast('ব্যাগে যোগ করা হয়েছে!', `${p.nameBn} (${chosenSize}) সফলভাবে যুক্ত হয়েছে।`);
    }

    function buyNowQuick(prodId) {
      const p = allProducts.find(x => x.id === prodId);
      if (!p) return;

      const cart = getCart();
      const defaultVariant = (p.variants && p.variants.length > 0) ? p.variants[0] : null;
      const chosenSize = defaultVariant ? defaultVariant.size : (p.availableSizes || 'Free Size');
      const variantId = defaultVariant ? defaultVariant.id : null;
      const price = p.salePrice || p.regularPrice;

      const match = cart.find(x => x.productId === p.id && (!variantId || x.variantId === variantId));
      if (match) {
        match.quantity += 1;
      } else {
        cart.push({
          productId: p.id,
          variantId: variantId,
          name: p.name,
          nameBn: p.nameBn,
          slug: p.slug,
          imageUrl: p.images[0],
          price: price,
          size: chosenSize,
          quantity: 1
        });
      }
      saveCart(cart);
      window.location.href = 'checkout.html';
    }

    async function loadData() {
      updateBadge();
      const params = new URLSearchParams(window.location.search);
      selectedCategory = params.get('category') || '';
      const searchParam = params.get('q') || '';
      if (searchParam) document.getElementById('catalogSearch').value = searchParam;

      try {
        const res = await fetch('api/products.php').then(r => r.json());
        allProducts = res.products || [];
        allCategories = res.categories || [];

        renderCategoryPills();
        filterProducts();
      } catch (err) {
        console.error(err);
      }
    }

    function renderCategoryPills() {
      const container = document.getElementById('categoryPills');
      const allActive = !selectedCategory ? 'bg-[#762A43] text-white' : 'bg-white text-gray-700 hover:bg-gray-50 border border-gray-200';
      let html = `<button onclick="setCategory('')" class="px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap shadow-xs cursor-pointer ${allActive}">সকল পোশাক</button>`;

      allCategories.forEach(c => {
        const active = selectedCategory === c.slug ? 'bg-[#762A43] text-white' : 'bg-white text-gray-700 hover:bg-gray-50 border border-gray-200';
        html += `<button onclick="setCategory('${c.slug}')" class="px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap shadow-xs cursor-pointer ${active}">${c.nameBn}</button>`;
      });
      container.innerHTML = html;
    }

    function setCategory(slug) {
      selectedCategory = slug;
      renderCategoryPills();
      filterProducts();
    }

    function filterProducts() {
      const q = document.getElementById('catalogSearch').value.toLowerCase().trim();
      const sort = document.getElementById('sortSelect').value;

      let list = allProducts.filter(p => {
        const matchCat = !selectedCategory || p.categorySlug === selectedCategory;
        const matchQ = !q || p.name.toLowerCase().includes(q) || p.nameBn.includes(q) || (p.description && p.description.includes(q));
        return matchCat && matchQ;
      });

      if (sort === 'price-asc') {
        list.sort((a, b) => (a.salePrice || a.regularPrice) - (b.salePrice || b.regularPrice));
      } else if (sort === 'price-desc') {
        list.sort((a, b) => (b.salePrice || b.regularPrice) - (a.salePrice || a.regularPrice));
      }

      const grid = document.getElementById('catalogGrid');
      if (list.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-16 text-center text-gray-400 text-xs">কোনো পোশাক পাওয়া যায়নি।</div>';
        return;
      }

      grid.innerHTML = list.map(p => {
        const price = p.salePrice || p.regularPrice;
        const hasDiscount = p.salePrice && p.salePrice < p.regularPrice;
        const discountPct = hasDiscount ? Math.round(((p.regularPrice - p.salePrice) / p.regularPrice) * 100) : 0;
        return `
          <div class="bg-white rounded-2xl border border-gray-100 hover:border-[#C5A46D]/60 hover:shadow-xl transition-all flex flex-col justify-between overflow-hidden h-full">
            <a href="product.html?slug=${p.slug}" class="product-img-box block">
              <img src="${p.images[0]}" alt="${p.nameBn}">
              ${hasDiscount ? `<div class="absolute top-2.5 left-2.5 bg-[#762A43] text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full shadow-md">${discountPct}% ছাড়</div>` : ''}
              <div class="absolute bottom-2.5 left-2.5 bg-white/90 text-[#252525] text-[10px] font-medium px-2 py-0.5 rounded shadow-xs">${p.categoryNameBn || ''}</div>
            </a>
            <div class="p-3.5 sm:p-4 flex-1 flex flex-col justify-between">
              <div>
                <a href="product.html?slug=${p.slug}" class="text-xs sm:text-sm font-semibold text-[#252525] line-clamp-2 hover:text-[#762A43]">${p.nameBn}</a>
                <div class="mt-2 flex items-baseline gap-2">
                  <span class="text-sm sm:text-base font-bold text-[#762A43] tabular-nums">৳ ${price.toLocaleString()}</span>
                  ${hasDiscount ? `<span class="text-xs text-gray-400 line-through tabular-nums">৳ ${p.regularPrice.toLocaleString()}</span>` : ''}
                </div>
              </div>
              <div class="mt-4 grid grid-cols-2 gap-2 pt-2.5 border-t border-gray-100">
                <button type="button" onclick="buyNowQuick('${p.id}')" class="w-full py-2.5 rounded-xl bg-[#762A43] hover:bg-[#5E2034] text-white text-[11px] font-bold text-center flex items-center justify-center gap-1 shadow-sm transition-all cursor-pointer">
                  অর্ডার করুন
                </button>
                <button type="button" onclick="addToCartQuick('${p.id}')" class="w-full py-2.5 rounded-xl border border-gray-200 text-gray-700 hover:border-[#762A43] hover:text-[#762A43] hover:bg-[#F7F0E8]/50 text-[11px] font-bold flex items-center justify-center gap-1 transition-all cursor-pointer">
                  🛍️ ব্যাগে রাখুন
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
